name: Scopy
options:
  bundleIdPrefix: com.scopy
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

schemes:
  Scopy:
    build:
      targets:
        Scopy: all
        ScopyTests: [test]
        ScopyUITests: [test]
    test:
      targets:
        - ScopyTests
        - ScopyUITests
  ScopyWarmProfile:
    build:
      targets:
        Scopy: all
        ScopyUITests: [test]
    test:
      config: Release
      targets:
        - ScopyUITests
    run:
      config: Release
    profile:
      config: Release
  ScopyTSan:
    build:
      targets:
        ScopyTestHost: all
        ScopyTSanTests: [test]
    test:
      targets:
        - ScopyTSanTests

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_ENTITLEMENTS: Scopy/Scopy.entitlements
    PRODUCT_BUNDLE_IDENTIFIER: com.scopy.app
    # SwiftPM packages still build into DerivedData; add search paths so App/Test targets can `import ScopyKit`
    SWIFT_INCLUDE_PATHS: "$(inherited) $(OBJROOT)/../Products/$(CONFIGURATION)"
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(OBJROOT)/../Products/$(CONFIGURATION)"
    # 版本号配置 (v0.6)
    # Note: 发布版本统一由 git tag 驱动，详见 scripts/version.sh 与 DEPLOYMENT.md。
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0"

packages:
  ScopyKit:
    path: .

targets:
  Scopy:
    type: application
    platform: macOS
    sources:
      - path: Scopy
        excludes:
          - "**/*.md"
          # Phase 7 (v0.43): App target only keeps App/UI/Presentation.
          # Backend (Domain/Application/Infrastructure/Services/Utilities) is provided by SwiftPM module `ScopyKit`.
          - "Application/**"
          - "Domain/**"
          - "Extensions/**"
          - "Infrastructure/**"
          - "Models/**"
          - "Protocols/**"
          - "Services/**"
          - "Utilities/**"
          # These runtime assets are staged as one verified folder by the post-build scripts below.
          - "Resources/**"
    settings:
      base:
        PRODUCT_NAME: Scopy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Scopy/Info.plist
    dependencies:
      - sdk: libsqlite3.tbd
      - package: ScopyKit
        product: ScopyKit
      - package: ScopyKit
        product: ScopyUISupport
    postBuildScripts:
      - name: "Stage MarkdownPreview Assets"
        script: |
          set -euo pipefail
          SRC_DIR="${SRCROOT}/Scopy/Resources/MarkdownPreview"
          DST_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/MarkdownPreview"
          if [ ! -d "$SRC_DIR" ]; then
            echo "Missing MarkdownPreview assets: $SRC_DIR" >&2
            if [ "${CONFIGURATION:-Debug}" = "Release" ]; then
              exit 1
            fi
            exit 0
          fi
          mkdir -p "$DST_DIR"
          rsync -a --delete "$SRC_DIR"/ "$DST_DIR"/
          STAMP_FILE="${DERIVED_FILE_DIR}/stage_markdown_preview_assets.stamp"
          mkdir -p "$(dirname "$STAMP_FILE")"
          touch "$STAMP_FILE"
        inputFiles:
          - "$(SRCROOT)/Scopy/Resources/MarkdownPreview"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/stage_markdown_preview_assets.stamp"
        basedOnDependencyAnalysis: false
      - name: "Fix Bundled Tool Permissions"
        script: |
          set -euo pipefail
          SRC_TOOL="${SRCROOT}/Scopy/Resources/Tools/pngquant"
          DST_TOOL_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Tools"
          DST_TOOL="${DST_TOOL_DIR}/pngquant"
          if [ ! -f "$SRC_TOOL" ]; then
            echo "Missing bundled tool: $SRC_TOOL" >&2
            if [ "${CONFIGURATION:-Debug}" = "Release" ]; then
              exit 1
            fi
            exit 0
          fi
          mkdir -p "$DST_TOOL_DIR"
          if [ ! -f "$DST_TOOL" ] || ! cmp -s "$SRC_TOOL" "$DST_TOOL"; then
            ditto "$SRC_TOOL" "$DST_TOOL"
          fi
          chmod +x "$DST_TOOL" || true

          SRC_TP_DIR="${SRCROOT}/Scopy/Resources/ThirdParty/pngquant"
          DST_TP_PARENT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ThirdParty"
          DST_TP_DIR="${DST_TP_PARENT}/pngquant"
          if [ -d "$SRC_TP_DIR" ]; then
            mkdir -p "$DST_TP_PARENT"
            mkdir -p "$DST_TP_DIR"
            rsync -a --delete "$SRC_TP_DIR"/ "$DST_TP_DIR"/
          fi
          STAMP_FILE="${DERIVED_FILE_DIR}/fix_bundled_tool_permissions.stamp"
          mkdir -p "$(dirname "$STAMP_FILE")"
          touch "$STAMP_FILE"
        inputFiles:
          - "$(SRCROOT)/Scopy/Resources/Tools/pngquant"
          - "$(SRCROOT)/Scopy/Resources/ThirdParty/pngquant"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Tools/pngquant"
          - "$(DERIVED_FILE_DIR)/fix_bundled_tool_permissions.stamp"
        basedOnDependencyAnalysis: false
  ScopyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ScopyTests
        excludes:
          - "Fixtures/**"
      - path: ScopyTests/Fixtures
        buildPhase: resources
      # 独立测试 bundle 模式：直接包含应用源码，避免 SwiftUI App 生命周期冲突
      - path: Scopy
        excludes:
          - "**/*.md"
          - "main.swift"       # 排除应用入口，避免 @main 冲突
          - "ScopyApp.swift"   # 排除 SwiftUI App，避免 NSApplication 冲突
          - "Info.plist"
          - "*.entitlements"
          # Phase 7 (v0.43): Do not compile backend sources into tests; use `ScopyKit` dependency instead.
          - "Application/**"
          - "Domain/**"
          - "Extensions/**"
          - "Infrastructure/**"
          - "Models/**"
          - "Protocols/**"
          - "Services/**"
          - "Utilities/**"
    settings:
      base:
        PRODUCT_NAME: ScopyTests
        PRODUCT_BUNDLE_IDENTIFIER: com.scopy.tests
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSPrincipalClass: XCTestCase
        # 保持独立测试 bundle 模式；Scopy 依赖只用于构建 @testable import 所需模块。
        TEST_HOST: ""
        BUNDLE_LOADER: ""
    dependencies:
      - target: Scopy
        link: false
      - sdk: libsqlite3.tbd
      - package: ScopyKit
        product: ScopyKit
      - package: ScopyKit
        product: ScopyUISupport
  ScopyTestHost:
    type: application
    platform: macOS
    sources:
      - path: ScopyTestHost
    settings:
      base:
        PRODUCT_NAME: ScopyTestHost
        PRODUCT_BUNDLE_IDENTIFIER: com.scopy.testhost
        GENERATE_INFOPLIST_FILE: true

  ScopyTSanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ScopyTests
        excludes:
          - "Fixtures/**"
          - "IntegrationTests.swift"
          - "PerformanceTests.swift"
      - path: ScopyTests/Fixtures
        buildPhase: resources
      # Hosted test bundle mode: includes app sources but excludes entrypoints to avoid @main conflicts.
      - path: Scopy
        excludes:
          - "**/*.md"
          - "main.swift"
          - "ScopyApp.swift"
          - "AppDelegate.swift"
          - "Info.plist"
          - "*.entitlements"
          # Phase 7 (v0.43): Do not compile backend sources into tests; use `ScopyKit` dependency instead.
          - "Application/**"
          - "Domain/**"
          - "Extensions/**"
          - "Infrastructure/**"
          - "Models/**"
          - "Protocols/**"
          - "Services/**"
          - "Utilities/**"
    settings:
      base:
        PRODUCT_NAME: ScopyTSanTests
        PRODUCT_BUNDLE_IDENTIFIER: com.scopy.tsan.tests
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ScopyTests/ScopyTSanTests-Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScopyTestHost.app/Contents/MacOS/ScopyTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_SWIFT_FLAGS: "$(inherited) -DSCOPY_TSAN_TESTS"
    dependencies:
      - target: Scopy
      - target: ScopyTestHost
      - sdk: libsqlite3.tbd
      - package: ScopyKit
        product: ScopyKit
      - package: ScopyKit
        product: ScopyUISupport
  ScopyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ScopyUITests
    settings:
      base:
        PRODUCT_NAME: ScopyUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.scopy.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Scopy
    dependencies:
      - target: Scopy
